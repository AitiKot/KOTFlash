name: tests
on:
  push:
  pull_request:
jobs:
  cpu-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install numpy pytest build
      - run: python -m pip install -e .
      - run: python -m compileall -q kotflash benchmarks tests
      - run: pytest -q
      - run: python benchmarks/benchmark_attention.py --device cpu --batch 1 --q-heads 2 --kv-heads 1 --seq 16 --head-dim 8 --warmup 1 --iterations 2 --repeats 3
      - run: python -m build
