[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kotflash"
version = "0.1.0"
description = "Experimental memory-efficient attention kernels optimized for NVIDIA Turing GPUs"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "KOTFlash Contributors" }]
keywords = ["attention", "flash-attention", "cuda", "turing", "t4", "pytorch", "triton"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
triton = ["triton>=3.2,<3.3"]
test = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["kotflash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
