[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kotflash"
version = "0.2.0"
description = "Experimental memory-efficient attention kernels for NVIDIA Turing GPUs"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AitiKot" }]
keywords = ["attention", "flash-attention", "cuda", "turing", "t4", "pytorch", "triton"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
triton = ["triton>=3.2,<3.3"]
t4 = ["triton>=3.2,<3.3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["kotflash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
